name: Unit Tests

on:
  push:
    branches:
     - '**'
  pull_request:
    branches:
      - main
      - 2.3.x
    paths-ignore:
      - "doc/**"
      - "web/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  ubuntu:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      matrix:
        platform: [ubuntu-24.04, ubuntu-24.04-arm]
        env_file: [actions-311.yaml, actions-312.yaml, actions-313.yaml]
        # Prevent the include jobs from overriding other jobs
        pattern: [""]
        pandas_future_infer_string: ["1"]
        include:
          - name: "Downstream Compat"
            env_file: actions-313-downstream_compat.yaml
            pattern: "not slow and not network and not single_cpu"
            pytest_target: "pandas/tests/test_downstream.py"
            platform: ubuntu-24.04
          - name: "Minimum Versions"
            env_file: actions-311-minimum_versions.yaml
            pattern: "not slow and not network and not single_cpu"
            platform: ubuntu-24.04
          - name: "Freethreading"
            env_file: actions-313-freethreading.yaml
            pattern: "not slow and not network and not single_cpu"
            platform: ubuntu-24.04
          - name: "Without PyArrow"
            env_file: actions-312.yaml
            pattern: "not slow and not network and not single_cpu"
            platform: ubuntu-24.04
          - name: "Locale: it_IT"
            env_file: actions-313.yaml
            pattern: "not slow and not network and not single_cpu"
            extra_apt: "language-pack-it"
            lang: "it_IT.utf8"
            lc_all: "it_IT.utf8"
            extra_loc: "it_IT"
            platform: ubuntu-24.04
          - name: "Locale: zh_CN"
            env_file: actions-313.yaml
            pattern: "not slow and not network and not single_cpu"
            extra_apt: "language-pack-zh-hans"
            lang: "zh_CN.utf8"
            lc_all: "zh_CN.utf8"
            extra_loc: "zh_CN"
            platform: ubuntu-24.04
          - name: "PANDAS_FUTURE_INFER_STRING=0"
            env_file: actions-313.yaml
            pandas_future_infer_string: "0"
            platform: ubuntu-24.04
          - name: "Numpy Dev"
            env_file: actions-313-numpydev.yaml
            pattern: "not slow and not network and not single_cpu"
            test_args: "-W error::DeprecationWarning -W error::FutureWarning"
            platform: ubuntu-24.04
          - name: "Pyarrow Nightly"
            env_file: actions-313-pyarrownightly.yaml
            pattern: "not slow and not network and not single_cpu"
            platform: ubuntu-24.04
      fail-fast: false
    name: ${{ matrix.name || format('{0} {1}', matrix.platform, matrix.env_file) }}
    env:
      PATTERN: ${{ matrix.pattern }}
      LANG: ${{ matrix.lang || 'C.UTF-8' }}
      LC_ALL: ${{ matrix.lc_all || '' }}
      PANDAS_CI: '1'
      PANDAS_FUTURE_INFER_STRING: ${{ matrix.pandas_future_infer_string || '1' }}
      TEST_ARGS: ${{ (matrix.test_args || '') }} --testmon
      PYTEST_WORKERS: 'auto'
      PYTEST_TARGET: ${{ matrix.pytest_target || 'pandas' }}
      QT_QPA_PLATFORM: offscreen
      REMOVE_PYARROW: ${{ matrix.name == 'Without PyArrow' && '1' || '0' }}
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-${{ matrix.env_file }}-${{ matrix.pattern }}-${{ matrix.extra_apt || '' }}-${{ matrix.pandas_future_infer_string }}-${{ matrix.platform }}
      cancel-in-progress: true

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: pandas
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

      postgres:
        image: postgres:17
        env:
          PGUSER: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandas
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      moto:
        image: motoserver/moto:5.0.27
        ports:
          - 5000:5000

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Fetch upstream tags for Versioneer
      run: |
        git remote get-url upstream || git remote add upstream https://github.com/pandas-dev/pandas.git
        git fetch --tags upstream --force
        git fetch --tags origin --force
        git describe --tags --always || true

    - name: Extra installs
      run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 ${{ matrix.extra_apt || ''}}

    - name: Generate extra locales
      run: sudo locale-gen ${{ matrix.extra_loc }}
      if: ${{ matrix.extra_loc }}

    - name: Set up Conda
      uses: ./.github/actions/setup-conda
      with:
        environment-file: ci/deps/${{ matrix.env_file }}

    - name: Install pytest-testmon
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest-testmon

    - name: Restore testmon cache
      uses: actions/cache@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-${{ matrix.env_file }}-${{ matrix.platform }}-${{ github.ref_name }}
        restore-keys: |
          testmon-${{ runner.os }}-${{ matrix.env_file }}-${{ matrix.platform }}-
          testmon-${{ runner.os }}-${{ matrix.env_file }}-
          testmon-${{ runner.os }}-

    - name: Build Pandas
      id: build
      uses: ./.github/actions/build_pandas
      with:
        werror: ${{ matrix.name != 'Freethreading' }}

    - name: Test (not single_cpu)
      uses: ./.github/actions/run-tests
      env:
        PATTERN: ${{ env.PATTERN == '' && 'not single_cpu' || matrix.pattern }}

    - name: Test (single_cpu)
      uses: ./.github/actions/run-tests
      env:
        PATTERN: 'single_cpu'
        PYTEST_WORKERS: 0
      if: ${{ matrix.pattern == '' && (always() && steps.build.outcome == 'success')}}

  macos-windows:
    timeout-minutes: 90
    strategy:
      matrix:
        os: [macos-13, macos-14, windows-latest]
        env_file: [actions-311.yaml, actions-312.yaml, actions-313.yaml]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ format('{0} {1}', matrix.os, matrix.env_file) }}
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-${{ matrix.env_file }}-${{ matrix.os }}
      cancel-in-progress: true
    env:
      PANDAS_CI: 1
      PYTEST_TARGET: pandas
      PATTERN: "not slow and not db and not network and not single_cpu"
      PYTEST_WORKERS: 'auto'
      TEST_ARGS: "--testmon"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream tags for Versioneer
        run: |
          git remote get-url upstream || git remote add upstream https://github.com/pandas-dev/pandas.git
          git fetch --tags upstream --force
          git fetch --tags origin --force
          git describe --tags --always || true

      - name: Set up Conda
        uses: ./.github/actions/setup-conda
        with:
          environment-file: ci/deps/${{ matrix.env_file }}

      - name: Install pytest-testmon
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-testmon

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ matrix.env_file }}-${{ matrix.os }}-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ matrix.env_file }}-${{ matrix.os }}-
            testmon-${{ runner.os }}-${{ matrix.env_file }}-
            testmon-${{ runner.os }}-

      - name: Build Pandas
        uses: ./.github/actions/build_pandas

      - name: Test
        uses: ./.github/actions/run-tests

  Linux-32-bit:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux2014_i686
      options: --platform linux/386
    steps:
      - name: Checkout pandas Repo
        run: |
          git config --global --add safe.directory $PWD
          if [ $GITHUB_EVENT_NAME != pull_request ]; then
              git clone --recursive --branch=$GITHUB_REF_NAME https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE
              git reset --hard $GITHUB_SHA
          else
              git clone --recursive https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE
              git fetch origin $GITHUB_REF:my_ref_name
              git checkout $GITHUB_BASE_REF
              git -c user.email="you@example.com" merge --no-commit my_ref_name
          fi

      - name: Fetch upstream tags for Versioneer
        run: |
          cd "$GITHUB_WORKSPACE"
          git remote get-url upstream || git remote add upstream https://github.com/pandas-dev/pandas.git
          git fetch --tags upstream --force
          git describe --tags --always || true

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-linux32-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-linux32-
            testmon-${{ runner.os }}-

      - name: Build environment and Run Tests
        run: |
          /opt/python/cp313-cp313/bin/python -m venv ~/virtualenvs/pandas-dev
          . ~/virtualenvs/pandas-dev/bin/activate
          python -m pip install --no-cache-dir -U pip wheel setuptools meson[ninja]==1.2.1 meson-python==0.13.1
          python -m pip install numpy -Csetup-args="-Dallow-noblas=true"
          python -m pip install --no-cache-dir versioneer[toml] cython==3.0.10 python-dateutil pytest>=8.3.4 pytest-xdist>=3.6.1 hypothesis>=6.116.0 pytest-testmon
          python -m pip install --no-cache-dir --no-build-isolation -e . -Csetup-args="--werror"
          python -m pip list --no-cache-dir
          PANDAS_CI=1 python -m pytest -m 'not slow and not network and not clipboard and not single_cpu' pandas --junitxml=test-data.xml --testmon
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-32bit
      cancel-in-progress: true

  Linux-Musl:
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/musllinux_1_2_x86_64
    steps:
      - name: Checkout pandas Repo
        run: |
          git config --global --add safe.directory $PWD
          if [ $GITHUB_EVENT_NAME != pull_request ]; then
              git clone --recursive --branch=$GITHUB_REF_NAME https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE
              git reset --hard $GITHUB_SHA
          else
              git clone --recursive https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE
              git fetch origin $GITHUB_REF:my_ref_name
              git checkout $GITHUB_BASE_REF
              git -c user.email="you@example.com" merge --no-commit my_ref_name
          fi
      - name: Configure System Packages
        run: |
          apk update
          apk add musl-locales
      - name: Build environment
        run: |
          /opt/python/cp313-cp313/bin/python -m venv ~/virtualenvs/pandas-dev
          . ~/virtualenvs/pandas-dev/bin/activate
          python -m pip install --no-cache-dir -U pip wheel setuptools meson-python==0.13.1 meson[ninja]==1.2.1
          python -m pip install --no-cache-dir versioneer[toml] cython numpy python-dateutil pytest>=8.3.4 pytest-xdist>=3.6.1 hypothesis>=6.116.0 pytest-testmon
          python -m pip install --no-cache-dir --no-build-isolation -e . -Csetup-args="--werror"
          python -m pip list --no-cache-dir

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-musl-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-musl-
            testmon-${{ runner.os }}-

      - name: Run Tests
        run: |
          . ~/virtualenvs/pandas-dev/bin/activate
          PANDAS_CI=1 python -m pytest -m 'not slow and not network and not clipboard and not single_cpu' pandas --junitxml=test-data.xml --testmon
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-musl
      cancel-in-progress: true

  python-dev:
    defaults:
      run:
        shell: bash -eou pipefail {0}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macOS-13, macOS-14, windows-latest]

    timeout-minutes: 90

    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-${{ matrix.os }}-python-dev
      cancel-in-progress: true

    env:
      PYTEST_WORKERS: "auto"
      PANDAS_CI: 1
      PATTERN: "not slow and not network and not clipboard and not single_cpu"
      PYTEST_TARGET: pandas
      TEST_ARGS: "--testmon"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python Dev Version
        uses: actions/setup-python@v6
        with:
          python-version: '3.14-dev'

      - name: Build Environment
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel meson[ninja]==1.2.1 meson-python==0.13.1
          python -m pip install --pre --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy
          python -m pip install versioneer[toml] python-dateutil tzdata cython hypothesis>=6.116.0 pytest>=8.3.4 pytest-xdist>=3.6.1 pytest-cov
          python -m pip install -ve . --no-build-isolation --no-index --no-deps -Csetup-args="--werror"
          python -m pip list

      - name: Install pytest-testmon
        run: |
          python -m pip install pytest-testmon

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-pydev-${{ matrix.os }}-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-pydev-${{ matrix.os }}-
            testmon-${{ runner.os }}-pydev-
            testmon-${{ runner.os }}-

      - name: Run Tests
        uses: ./.github/actions/run-tests

  # NOTE: this job must be kept in sync with the Pyodide build job in wheels.yml
  emscripten:
    name: Pyodide build
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-wasm
      cancel-in-progress: true
    steps:
      - name: Checkout pandas Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python for pyodide-build
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.58'
          actions-cache-folder: emsdk-cache

      - name: Install pyodide-build
        run: pip install "pyodide-build>=0.29.2"

      - name: Build pandas for Pyodide
        run: |
          pyodide build

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Pyodide virtual environment
        env:
          pyodide-version: '0.27.1'
        run: |
          pyodide xbuildenv install ${{ env.pyodide-version }}
          pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate
          pip install dist/*.whl

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-pyodide-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-pyodide-
            testmon-${{ runner.os }}-

      - name: Test pandas for Pyodide
        env:
          PANDAS_CI: 1
        run: |
          source .venv-pyodide/bin/activate
          pip install pytest hypothesis pytest-testmon
          # do not import pandas from the checked out repo
          cd ..
          python -c 'import pandas as pd; pd.test(extra_args=["-m", "not clipboard and not single_cpu and not slow and not network and not db", "--testmon"])'
